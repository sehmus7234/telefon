# Paketleme + otomatik güncelleme yapılandırması (prompt 9)
# electron-updater, paketlenen uygulamanın içine gömülen app-update.yml'i okur;
# `publish` bloğu bu dosyayı üretir.
appId: com.patron.telefon
productName: Telefon
directories:
  buildResources: build
  output: release
extraResources:
  - from: resources/platform-tools
    to: platform-tools
    filter:
      - '**/*'
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!resources/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{README.md,CHANGELOG.md,dev-app-update.yml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
npmRebuild: false
win:
  executableName: telefon
  icon: build/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: patron
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
publish:
  provider: github
  owner: PATRON # <-- GitHub kullanıcı/org adınızla değiştirin (docs/AUTO_UPDATE.md)
  repo: telefon
